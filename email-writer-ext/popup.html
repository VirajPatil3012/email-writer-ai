<!DOCTYPE html>
<html>

<head>
    <title>Email Writer Settings</title>
</head>

<body>

    <h2>Email Writer Settings</h2>

    <label>Gemini API URL</label>
    <input id="geminiUrl" type="text">

    <label>Gemini API Key</label>
    <input id="geminiKey" type="password">

    <label>Reply Style</label>

    <select id="tone">
        <option value="professional">Professional</option>
        <option value="friendly">Friendly</option>
        <option value="casual">Casual</option>
        <option value="concise">Concise</option>
        <option value="apologetic">Apologetic</option>
        <option value="thankful">Thankful</option>
    </select>

    <button id="save">Save Settings</button>

    <p id="status"></p>

    <script src="popup.js"></script>

</body>

</html>
